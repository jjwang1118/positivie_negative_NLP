name: nlp-sentiment

channels:
- pytorch # official PyTorch channel (GPU builds)
- nvidia # CUDA toolkit packages
- conda-forge
- defaults

dependencies:
- python=3.11
- pip

# ── PyTorch with CUDA 12.4 (works on RTX 5070 / CUDA 13.x hardware) ──────────
- pytorch>=2.6.0
- torchvision
- torchaudio
- pytorch-cuda=12.4

# ── Conda-managed packages ───────────────────────────────────────────────────
- numpy>=1.26
- pandas>=2.2
- scikit-learn>=1.6
- matplotlib>=3.9
- seaborn>=0.13
- pyyaml>=6.0
- tqdm>=4.67
- jupyter>=1.1
- ipykernel>=6.29
- pytest>=8.3
- pytest-cov>=6.0

# ── pip-only packages ────────────────────────────────────────────────────────
- pip:
  - transformers>=4.50.0
  - tokenizers>=0.21.0
  - shap>=0.47.0
