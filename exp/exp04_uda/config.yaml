experiment:
  name: exp04
  description: "UDA (Unsupervised Data Augmentation) — semi-supervised training with TSA + TF-IDF augmentation + KL consistency loss"

model:
  name: sbert-minilm  # key into MODEL_REGISTRY in src/config.py
  hidden_dim: 384     # SBERT all-MiniLM-L6-v2 output dimension
  mlp_hidden: 64
  dropout: 0.1
  num_labels: 2       # 0=negative, 1=positive

training:
  learning_rate: 2.0e-4
  batch_size: 32
  epochs: 30
  max_length: 128
  seed: 42
  n_folds: 5

uda:
  lambda_u: 0.6              # consistency loss weight total_loss = sup_loss + lambda_u × con_loss
  confidence_threshold: 0.9   # unlabeled samples with max(p) < threshold are filtered out
  tsa_schedule: linear        # Training Signal Annealing (TSA) schedule: linear / log / exp
  augment_prob: 0.3           # probability of replacing each low-TF-IDF token
  unlabeled_batch_size: 32    # batch size for unlabeled data loader
