experiment:
  name: exp05

model:
  name: sbert-minilm
  hidden_dim: 384
  mlp_hidden: 64
  dropout: 0.1
  num_labels: 2

training:
  learning_rate: 2.0e-4
  batch_size: 32
  epochs: 30
  max_length: 128
  seed: 42
  n_folds: 5

uda:
  lambda_u: 0.5
  confidence_threshold: 0.9
  tsa_schedule: linear
  augment_prob: 0.2
  unlabeled_batch_size: 32
