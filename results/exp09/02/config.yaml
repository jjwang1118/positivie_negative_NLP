experiment:
  name: exp09

model:
  name: sentiment-roberta-large
  hidden_dim: 1024
  mlp_hidden: 64
  dropout: 0.1
  num_labels: 2

# Stage 1: Frozen encoder, labeled data only
# Goal: generate high-quality initial pseudo-labels via model confidence
stage1:
  learning_rate: 1.0e-4
  batch_size: 32
  epochs: 20
  max_length: 128
  seed: 42
  n_folds: 5
  label_smoothing: 0.1
  warmup_ratio: 0.1
  confidence_threshold: 0.95   # only top-confidence samples become pseudo-labels

# Stage 2: Partial encoder unfreeze + Stage 1 pseudo-labels
# Goal: adapt encoder representations to this dataset
stage2:
  encoder_lr: 5.0e-6            # 20x smaller than head — prevents catastrophic forgetting
  head_lr: 1.0e-4
  batch_size: 32
  epochs: 20
  max_length: 128
  label_smoothing: 0.1
  warmup_ratio: 0.1
  unfreeze_last_n: 3            # unfreeze last 3 of 24 RoBERTa-large layers
  confidence_threshold: 0.90   # slightly relaxed threshold for stage3

# Stage 3 (optional): Final refinement with Stage 2 pseudo-labels
stage3:
  enabled: true
  encoder_lr: 2.0e-6
  head_lr: 5.0e-5
  batch_size: 32
  epochs: 15
  max_length: 128
  label_smoothing: 0.1
  warmup_ratio: 0.05
