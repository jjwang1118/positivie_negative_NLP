experiment:
  name: exp11

model:
  name: roberta-large

# Phase 0: train on ALL labeled data to generate pseudo-labels for test set.
# No external file dependency — self-contained.
pseudo_gen:
  epochs: 3
  batch_size: 8
  gradient_accumulation: 2
  max_length: 192
  warmup_ratio: 0.1
  weight_decay: 0.05

# Phase 1: single-stage 5-fold training with labeled + pseudo-labels (v5 parameters).
training:
  learning_rate: 1.0e-5
  batch_size: 8
  gradient_accumulation: 2
  epochs: 3
  max_length: 192
  seed: 42
  n_folds: 5
  warmup_ratio: 0.1
  weight_decay: 0.05
