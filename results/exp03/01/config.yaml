experiment:
  name: exp03
  description: "Full Fine-tune - RoBERTa-base end-to-end fine-tune for maximum accuracy"

model:
  name: roberta-base  # key into MODEL_REGISTRY in src/config.py
  hidden_dim: 768     # roberta-base hidden size
  dropout: 0.1
  num_labels: 2       # 0=negative, 1=positive

training:
  learning_rate: 2.0e-5   # much smaller lr for full fine-tune
  batch_size: 16
  epochs: 5
  max_length: 128
  seed: 42
  n_folds: 3
  warmup_ratio: 0.06      # fraction of total steps used for linear warmup
