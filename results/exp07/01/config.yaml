experiment:
  name: exp07

model:
  name: sentiment-roberta-large
  hidden_dim: 1024
  mlp_hidden: 64
  dropout: 0.1
  num_labels: 2

training:
  learning_rate: 2.0e-4
  batch_size: 32
  epochs: 30
  max_length: 128
  seed: 42
  n_folds: 5

clustering:
  n_clusters: 100
  purity_threshold: 0.8
  min_labeled_per_cluster: 3
  random_state: 42
